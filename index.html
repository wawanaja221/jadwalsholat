/* =====================================================
   INDEXED DB
===================================================== */

let db = null;


function openDatabase(){

    return new Promise((resolve,reject)=>{

        const request =
            indexedDB.open(
                "JadwalSholatAudioDB",
                1
            );

        request.onupgradeneeded =
        function(e){

            const database =
                e.target.result;

            if(
                !database.objectStoreNames.contains(
                    "audio"
                )
            ){

                database.createObjectStore(
                    "audio",
                    {
                        keyPath:"id"
                    }
                );

            }

        };

        request.onsuccess =
        function(e){

            db =
                e.target.result;

            resolve();

        };

        request.onerror =
        function(){

            reject(request.error);

        };

    });

}


function saveAudio(id,name,file){

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction(
                "audio",
                "readwrite"
            );

        tx.objectStore("audio").put({

            id:id,

            name:name,

            file:file

        });

        tx.oncomplete =
            ()=>resolve();

        tx.onerror =
            ()=>reject(tx.error);

    });

}


function getAudio(id){

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction(
                "audio",
                "readonly"
            );

        const request =
            tx.objectStore("audio").get(id);

        request.onsuccess =
            ()=>resolve(request.result);

        request.onerror =
            ()=>reject(request.error);

    });

}


function deleteAudio(id){

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction(
                "audio",
                "readwrite"
            );

        tx.objectStore("audio").delete(id);

        tx.oncomplete =
            ()=>resolve();

        tx.onerror =
            ()=>reject(tx.error);

    });

}

/* =====================================================
   AUDIO CONTEXT
===================================================== */

function initAudio(){

    if(audioCtx)
        return;

    audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    gainNode =
        audioCtx.createGain();

    gainNode.gain.value =
        Number(
            localStorage.getItem(
                "volume"
            ) || 1
        );

    gainNode.connect(
        audioCtx.destination
    );

}


async function unlockAudio(){

    initAudio();

    try{

        if(
            audioCtx.state ===
            "suspended"
        ){

            await audioCtx.resume();

        }

        audioUnlocked = true;

        document.getElementById(
            "unlock"
        ).style.display =
            "none";

    }
    catch(e){

        console.log(e);

    }

}

        now.getFullYear();

        now.getMonth()+1;

        now.getDate();

        DATA_AGUSTUS_2026[tanggal]

        PATOKAN.ashar,

}

/* =====================================================
   KONVERSI WAKTU
===================================================== */

function waktuHariIni(waktu){

    const p =
        waktu.split(":").map(Number);

    const d =
        new Date();

    d.setHours(
        p[0],
        p[1],
        0,
        0
    );

    return d;

}


/* =====================================================
   CARI WAKTU SHOLAT
===================================================== */

function getWaktuSholat(nama){

    const item =
        jadwal.find(
            x=>x.nama === nama
        );

    if(item)
        return item.waktu;

    return null;

}

    const now =
        new Date();


    /*
       Koreksi 1 hari mundur
       sesuai permintaan sebelumnya.
    */

    const hijriDate =
        new Date(now);

    hijriDate.setDate(
        hijriDate.getDate()-1

    const hijri =
        new Intl.DateTimeFormat(
            "id-TN-u-ca-islamic",
            {
                day:"numeric",
                month:"long",
                year:"numeric"
            }

    const masehi =
        now.toLocaleDateString(
            "id-ID",

                month:"long",
                year:"numeric"
            }

        "Wage",
        "Kliwon"

    ];


    const awal =
        new Date(
            1970,
            0,
            1
        );


    const now =

    const selisih =
        Math.floor(

        );

    document.getElementById(

    ).innerHTML =

/* =====================================================
   COUNTDOWN
===================================================== */

function updateCountdown(){

    const now =
        new Date();


    let target = null;

    let nama = "";


    const daftar = [];


    if(
        now.getDay() === 5
    ){

        daftar.push(
            {
                nama:"Subuh",
                waktu:jadwal[0].waktu
            },
            {
                nama:"Jumatan",
                waktu:"11:33"
            },
            {
                nama:"Ashar",
                waktu:jadwal[2].waktu
            },
            {
                nama:"Maghrib",
                waktu:jadwal[3].waktu
            },
            {
                nama:"Isya",
                waktu:jadwal[4].waktu
            }
        );

    }
    else{

        daftar.push(
            {
                nama:"Subuh",
                waktu:jadwal[0].waktu
            },
            {
                nama:"Dzuhur",
                waktu:jadwal[1].waktu
            },
            {
                nama:"Ashar",
                waktu:jadwal[2].waktu
            },
            {
                nama:"Maghrib",
                waktu:jadwal[3].waktu
            },
            {
                nama:"Isya",
                waktu:jadwal[4].waktu
            }
        );

    }


    for(
        const item of daftar
    ){

        const waktu =
            waktuHariIni(
                item.waktu
            );


        if(
            waktu > now
        ){

            target =
                waktu;

            nama =
                item.nama;

            break;

        }

    }


    if(!target){

        target =
            waktuHariIni(
                daftar[0].waktu
            );

        target.setDate(
            target.getDate()+1
        );

        nama =
            daftar[0].nama;

    }


    const s =
        target-now;


    const jam =
        Math.floor(
            s/3600000
        );


    const menit =
        Math.floor(
            (s%3600000)/60000
        );


    const detik =
        Math.floor(
            (s%60000)/1000
        );


    document.getElementById(
        "countdown"
    ).innerHTML =

        "Menuju " +
        nama +
        " " +

        String(jam)
        .padStart(2,"0") +

        ":" +

        String(menit)
        .padStart(2,"0") +

        ":" +

        String(detik)
        .padStart(2,"0");

}


/* =====================================================
   TARGET AUDIO
===================================================== */

function getTargetAudioTime(slot){

    /*
       AUDIO SUBUH
    */

    if(
        slot.id === "subuh"
    ){

        return getWaktuSholat(
            "Subuh"
        );

    }


    /*
       MAGHRIB BIASA

       HANYA:
       Minggu, Senin, Selasa,
       Rabu, Jumat, Sabtu

       KAMIS TIDAK JALAN.
    */

    if(
        slot.id === "maghrib"
    ){

        if(
            new Date().getDay() === 4
        ){

            return null;

        }

        return getWaktuSholat(
            "Maghrib"
        );

    }


    /*
       YASIN

       HANYA KAMIS
       DAN MENGIKUTI MAGHRIB
    */

    if(
        slot.id === "yasin"
    ){

        if(
            new Date().getDay() !== 4
        ){

            return null;

        }

        return getWaktuSholat(
            "Maghrib"
        );

    }


    /*
       JUMATAN
    */

    if(
        slot.id === "jumatan"
    ){

        if(
            new Date().getDay() !== 5
        ){

            return null;

        }

        return "11:33";

    }


    /*
       AZAN
    */

    if(
        slot.tipe === "sholat"
    ){

        return getWaktuSholat(
            slot.target
        );

    }


    /*
       AUDIO MANUAL
    */

    if(
        slot.tipe === "manual"
    ){

        return (
            audioSettings[
                slot.id
            ]?.time || null
        );

    }


    return null;

}


/* =====================================================
   INFO SLOT
===================================================== */

function getInfoSlot(slot){

    if(
        slot.id === "maghrib"
    ){

        return "Otomatis saat Maghrib — kecuali Kamis";

    }


    if(
        slot.id === "yasin"
    ){

        return "Kamis: otomatis saat Maghrib menggantikan Audio Maghrib";

    }


    if(
        slot.id === "jumatan"
    ){

        return "Khusus Jumat: 11:33";

    }


    if(
        slot.tipe === "sholat"
    ){

        return "Mengikuti jadwal " +
            slot.target;

    }


    if(
        slot.tipe === "manual"
    ){

        return "Jam bebas/manual";

    }


    return "";

}

                    slot.id === "maghrib"

                else if(

                else{

                        "⏰ Menunggu jadwal";

            div.innerHTML = `

<strong>
${slot.nama}

<div class="autoTime">
${waktuText}
</div>

<div class="info">
${getInfoSlot(slot)}

    :
    ""
}

<br>

<button
    onclick="hapusAudio('${slot.id}')"
>
Hapus Audio
</button>

<div
    class="status"
    id="status_${slot.id}"
>
${
    data.fileName
    ?
    "File: " + data.fileName
    :
    "Belum ada file"
}
</div>

`;


            container.appendChild(
                div
            );


            const fileInput =
                document.getElementById(
                    "file_" +
                    slot.id
                );


            fileInput.addEventListener(
                "change",
                async function(){

                    const file =
                        this.files[0];


                    if(!file)
                        return;


                    await saveAudio(
                        slot.id,
                        file.name,
                        file
                    );


                    if(
                        !audioSettings[
                            slot.id
                        ]
                    ){

                        audioSettings[
                            slot.id
                        ] = {};

                    }


                    audioSettings[
                        slot.id
                    ].fileName =
                        file.name;


                    localStorage.setItem(
                        "audioSettings",
                        JSON.stringify(
                            audioSettings
                        )
                    );


                    document.getElementById(
                        "status_" +
                        slot.id
                    ).innerText =
                        "File: " +
                        file.name;

                }
            );


            if(
                slot.tipe === "manual"
            ){

                const timeInput =
                    document.getElementById(
                        "time_" +
                        slot.id
                    );


                timeInput.addEventListener(
                    "change",
                    function(){

                        if(
                            !audioSettings[
                                slot.id
                            ]
                        ){

                            audioSettings[
                                slot.id
                            ] = {};

                        }


                        audioSettings[
                            slot.id
                        ].time =
                            this.value;


                        localStorage.setItem(
                            "audioSettings",
                            JSON.stringify(
                                audioSettings
                            )
                        );

                    }
                );

            }

        }
    );

}


/* =====================================================
   HAPUS AUDIO
===================================================== */

async function hapusAudio(id){

    await deleteAudio(id);


    delete audioSettings[id];


    localStorage.setItem(
        "audioSettings",
        JSON.stringify(
            audioSettings
        )
    );


    buatPanelAudio();

}


/* =====================================================
   PUTAR AUDIO
===================================================== */

async function playAudio(slot){

    if(!audioUnlocked)
        return;


    /*
       Jangan menumpuk audio.
    */

    if(
        activeAudio &&
        !activeAudio.ended
    ){

        return;

    }


    const data =
        await getAudio(
            slot.id
        );


    if(
        !data ||
        !data.file
    ){

        return;

    }


    const url =
        URL.createObjectURL(
            data.file
        );


    const audio =
        new Audio(url);


    audio.volume =
        Number(
            localStorage.getItem(
                "volume"
            ) || 1
        );


    activeAudio =
        audio;


    audio.onended =
    function(){

        URL.revokeObjectURL(
            url
        );

        activeAudio =
            null;

    };


    audio.onerror =
    function(){

        URL.revokeObjectURL(
            url
        );

        activeAudio =
            null;

    };


    try{

        await audio.play();

    }
    catch(e){

        console.log(
            "Autoplay diblokir:",
            e
        );

        activeAudio =
            null;

    }

}


/* =====================================================
   SCHEDULER AUDIO
===================================================== */

async function cekAudioOtomatis(){

    if(!audioUnlocked)
        return;


    const now =
        new Date();


    const tanggal =
        now.getFullYear() +
        "-" +
        String(
            now.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            now.getDate()
        ).padStart(2,"0");


    for(
        const slot of AUDIO_SLOTS
    ){

        const waktu =
            getTargetAudioTime(
                slot
            );


        if(!waktu)
            continue;


        const p =
            waktu
            .split(":")
            .map(Number);


        const key =
            tanggal +
            "_" +
            slot.id;


        /*
           Sudah diputar hari ini?
        */

        if(
            playedToday[key]
        ){

            continue;

        }


        /*
           Tepat waktu.
           Diberi toleransi 2 detik
           supaya interval tidak melewatkan
           waktu karena browser sedikit lambat.
        */

        if(

            now.getHours() === p[0] &&

            now.getMinutes() === p[1] &&

            now.getSeconds() <= 2

        ){

            /*
               KAMIS MAGHRIB:

               Audio Maghrib biasa sudah
               tidak mempunyai target.

               Yang mempunyai target adalah
               Audio Yasin.

               Jadi tidak mungkin keduanya
               bermain bersamaan.
            */

            playedToday[key] =
                true;


            await playAudio(
                slot
            );

        }

    }

}


/* =====================================================
   VOLUME
===================================================== */

const volume =
    document.getElementById(
        "volume"
    );


function updateVolume(){

    const value =
        Number(
            localStorage.getItem(
                "volume"
            ) || 1
        );


    volume.value =
        value;


    document.getElementById(
        "volText"
    ).innerText =
        Math.round(
            value * 100
        ) + "%";

}


volume.oninput =
function(){

    const value =
        Number(
            this.value
        );


    if(gainNode){

        gainNode.gain.value =
            value;

    }


    localStorage.setItem(
        "volume",
        value
    );


    document.getElementById(
        "volText"
    ).innerText =
        Math.round(
            value * 100
        ) + "%";

};


/* =====================================================
   PERGANTIAN HARI
===================================================== */

function cekHariBaru(){

    const hari =
        new Date()
        .toDateString();


    if(
        hari !==
        tanggalTerakhir
    ){

        playedToday = {};

        ambilJadwalSholat();

        updateTanggal();

        buatPanelAudio();

    }

}


/* =====================================================
   PANEL SETTING
===================================================== */

document.getElementById(
    "settingBtn"
).onclick =
function(){

    const panel =
        document.getElementById(
            "audioPanel"
        );


    panel.style.display =

        panel.style.display ===
        "none"

        ?

        "block"

        :

        "none";

};


/* =====================================================
   START
===================================================== */

async function startSystem(){

    updateJam();

    updateTanggal();

    getPasaranJawa();

    ambilJadwalSholat();

    updateCountdown();

    updateVolume();


    try{

        await openDatabase();

        buatPanelAudio();

    }
    catch(e){

        console.error(
            "IndexedDB:",
            e
        );

    }


    setInterval(
        updateJam,
        1000
    );


    setInterval(
        updateTanggal,
        60000
    );


    setInterval(
        getPasaranJawa,
        60000
    );


    setInterval(
        updateCountdown,
        1000
    );


    setInterval(
        tampilkanJadwal,
        1000
    );


    setInterval(
        cekHariBaru,
        1000
    );


    setInterval(
        cekAudioOtomatis,
        1000
    );

}


window.onload =
    startSystem;

</script>
