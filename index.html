/* =====================================================
   INDEXED DB (PENYAMBUNGAN KODE POTONGAN ANDA)
===================================================== */

function openDatabase(){
    return new Promise((resolve,reject)=>{
        const request = indexedDB.open("JadwalSholatAudioDB", 1);

        request.onupgradeneeded = function(e){
            const database = e.target.result;
            if(!database.objectStoreNames.contains("audio")){
                database.createObjectStore("audio", { keyPath:"id" });
            }
        };

        request.onsuccess = function(e){
            db = e.target.result;
            resolve(db);
        };

        request.onerror = function(e){
            reject(e.target.error);
        };
    });
}


/* =====================================================
   MANAJEMEN FILE AUDIO KE INDEXEDDB
===================================================== */

function loadAudioFromDB() {
    if (!db) return;
    let transaction = db.transaction(["audio"], "readonly");
    let store = transaction.objectStore("audio");
    AUDIO_SLOTS.forEach(slot => {
        let req = store.get(slot.id);
        req.onsuccess = function() {
            if (req.result) {
                audioFiles[slot.id] = req.result.blob;
                let statusEl = document.getElementById("status-" + slot.id);
                if (statusEl) statusEl.innerText = "Audio terpasang: " + req.result.name;
            }
        };
    });
}

function saveAudioToDB(id, files) {
    if (!db || !files || files.length === 0) return;
    let file = files[0];
    let transaction = db.transaction(["audio"], "readwrite");
    let store = transaction.objectStore("audio");
    store.put({ id: id, name: file.name, blob: file });
    audioFiles[id] = file;
    document.getElementById("status-" + id).innerText = "Audio terpasang: " + file.name;
}

function hitungWaktuAudio(waktuSholatStr, offsetDetik) {
    if(!waktuSholatStr) return "--:--:--";
    let [jam, menit] = waktuSholatStr.split(":").map(Number);
    let d = new Date();
    d.setHours(jam, menit, 0, 0);
    d.setSeconds(d.getSeconds() - offsetDetik);
    
    let h = String(d.getHours()).padStart(2, '0');
