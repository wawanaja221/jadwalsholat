    maghrib:"17:32:00",

    isya:"18:42:00",

/* =========================================================

========================================================= */

const DEFAULT_SETTINGS = {

    audio:{
        ...DEFAULT_AUDIO_ACUAN
    },

    jumatOffset:-1,

    jumatBatas:"12:00"

};


let SETTINGS =
    JSON.parse(
        localStorage.getItem(
            "WANS_SHOLAT_SETTINGS"
        )
    ) || structuredClone(DEFAULT_SETTINGS);


/* =========================================================
   KONVERSI WAKTU
========================================================= */

function waktuKeDetik(waktu){

    const p =
        waktu.split(":").map(Number);

    return (
        p[0] * 3600 +
        p[1] * 60 +
        (p[2] || 0)
    );

}


function detikKeWaktu(total){

    total =
        ((total % 86400) + 86400) % 86400;

    const jam =
        Math.floor(total / 3600);

    const menit =
        Math.floor(
            (total % 3600) / 60
        );

    const detik =
        total % 60;

    return (
        String(jam).padStart(2,"0") +
        ":" +
        String(menit).padStart(2,"0") +
        ":" +
        String(detik).padStart(2,"0")
    );

}


/* =========================================================
   OFFSET AUDIO
========================================================= */

function hitungOffset(audio,sholat){

    return (
        waktuKeDetik(audio) -
        waktuKeDetik(sholat)
    );

}


function getOffset(jenis){

    const map = {

        subuh:"subuh",

        dzuhur:"dzuhur",

        ashar:"ashar",

        maghrib:"maghrib",

        isya:"isya",

        yasin:"maghrib",

        jumatan:"jumatan"

    };


    return hitungOffset(

        SETTINGS.audio[jenis],

        SHOLAT_ACUAN[map[jenis]]

    );

}


/* =========================================================
   TANGGAL
========================================================= */

function getTanggalKey(date){

    return (
        date.getFullYear() +
        "-" +
        String(
            date.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            date.getDate()
        ).padStart(2,"0")
    );

}


/* =========================================================
   AMBIL DATA
========================================================= */

function ambilJadwalTanggal(date){

    return DATA_JADWAL[
        getTanggalKey(date)
    ] || null;

}


/* =========================================================
   UPDATE JADWAL
========================================================= */

function hitungImsakDariSubuh(subuh){

    if(!subuh || subuh === "--:--")
        return "--:--";

    return detikKeWaktu(
        waktuKeDetik(subuh + ":00") - (10 * 60)
    ).slice(0,5);

}


function updateJadwal(){

    const data =
        ambilJadwalTanggal(
            new Date()
        );


    if(data){

        jadwal.imsak =
            data[0] && data[0] !== "--:--"
            ? data[0]
            : hitungImsakDariSubuh(data[1]);

        jadwal.subuh =
            data[1];

        jadwal.dzuhur =
            data[2];

        jadwal.ashar =
            data[3];

        jadwal.maghrib =
            data[4];

        jadwal.isya =
            data[5];

    }


    tampilJadwal();

    updateAudioTimes();

}


/* =========================================================
   HITUNG AUDIO
========================================================= */

function hitungAudio(
    waktuSholat,
    offset
){

    return detikKeWaktu(

        waktuKeDetik(
            waktuSholat + ":00"
        ) + offset

    );

}


/* =========================================================
   AUDIO SUBUH
========================================================= */

function getJamAudioSubuh(){

    return hitungAudio(

        getOffset("subuh")

    );

}


/* =========================================================
   AUDIO BIASA
========================================================= */

function getJamAudio(jenis){

    if(jenis === "dzuhur")

        return hitungAudio(
            jadwal.dzuhur,
            getOffset("dzuhur")
        );


    if(jenis === "ashar")

        return hitungAudio(

        );


    if(jenis === "maghrib")

        return hitungAudio(
            jadwal.maghrib,
            getOffset("maghrib")
        );


    if(jenis === "isya")

        return hitungAudio(
            jadwal.isya,
            getOffset("isya")
        );


    if(jenis === "yasin")

        return hitungAudio(
            jadwal.maghrib,
            getOffset("yasin")
        );


    if(jenis === "jumatan"){

        const waktuJumat =
            detikKeWaktu(

                waktuKeDetik(
                    jadwal.dzuhur + ":00"
                ) +
                SETTINGS.jumatOffset * 60

            );


        return hitungAudio(

            waktuJumat,

            getOffset("jumatan")

        );

    }


    return null;

}


/* =========================================================
   WAKTU AZAN OTOMATIS
   TARGET DASAR = WAKTU SHOLAT + 12 DETIK
========================================================= */

function getJamAdzan(jenis){

    let waktu = null;


    if(jenis === "subuh")
        waktu = jadwal.subuh;


    if(jenis === "dzuhur")
        waktu = jadwal.dzuhur;


    if(jenis === "ashar")
        waktu = jadwal.ashar;


    if(jenis === "maghrib")
        waktu = jadwal.maghrib;


    if(jenis === "isya")
        waktu = jadwal.isya;


    if(!waktu)
        return null;


    return detikKeWaktu(

        waktuKeDetik(
            waktu + ":00"
        ) + 12

    );

}


/* =========================================================
   WAKTU JUMAT
========================================================= */

function getJamJumatan(){

    return detikKeWaktu(

        waktuKeDetik(
            jadwal.dzuhur + ":00"
        ) +
        SETTINGS.jumatOffset * 60

    );

}


/* =========================================================
   CEK MASIH JUMAT
========================================================= */

function sedangJumatan(){

    const now =
        new Date();

    if(now.getDay() !== 5)
        return false;


    const sekarang =
        now.getHours()*3600 +
        now.getMinutes()*60 +
        now.getSeconds();


    const batas =
        waktuKeDetik(
            SETTINGS.jumatBatas + ":00"
        );


    return sekarang < batas;

}


/* =========================================================
   TAMPIL JADWAL
========================================================= */

function tampilJadwal(){

    const jumat =

    const data = [

            azan:null
        },

        {

            azan:getJamAdzan("subuh")
        },

        {
            nama:

            waktu:
                jumat

                : jadwal.dzuhur,

            azan:
                jumat

                : getJamAdzan("dzuhur")
        },

                </div>`
                :
                `<div class="waktuAzan">
                    &nbsp;
                </div>`
            }

        `;


        document.getElementById(
            "jadwal"
        ).appendChild(div);

    });

}


/* =========================================================
   DATABASE
========================================================= */

let db = null;


function bukaDatabase(){

    return new Promise(
        (resolve,reject)=>{

            const request =
                indexedDB.open(
                    "JadwalSholatAudio",
                    3
                );


            request.onupgradeneeded =
            function(e){

                const database =
                    e.target.result;


                if(
                    !database
                    .objectStoreNames
                    .contains("audio")
                ){

                    database.createObjectStore(
                        "audio",
                        {keyPath:"id"}
                    );

                }

            };


            request.onsuccess =
            function(e){

                db =
                    e.target.result;

                resolve();

            };


            request.onerror =
            function(){

                reject(
                    request.error
                );

            };

        }
    );

}


/* =========================================================
   SIMPAN AUDIO
========================================================= */

function simpanAudio(id,file){

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    "audio",
                    "readwrite"
                );


            tx.objectStore(
                "audio"
            ).put({

                id:id,

                nama:file.name,

                file:file

            });


            tx.oncomplete =
                ()=>resolve();


            tx.onerror =
                ()=>reject(
                    tx.error
                );

        }
    );

}


/* =========================================================
   AMBIL AUDIO
========================================================= */

function ambilAudio(id){

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    "audio",
                    "readonly"
                );


            const request =
                tx.objectStore(
                    "audio"
                ).get(id);


            request.onsuccess =
                ()=>{
                    resolve(
                        request.result
                    );
                };


            request.onerror =
                ()=>{
                    reject(
                        request.error
                    );
                };

        }
    );

}

   HAPUS AUDIO
========================================================= */

function hapusAudio(id){

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    "audio",
                    "readwrite"
                );


            tx.objectStore(
                "audio"
            ).delete(id);


            tx.oncomplete =
                ()=>resolve();


            tx.onerror =
                ()=>reject(
                    tx.error
                );

        }
    );

}

/* =========================================================
   AUDIO PLAYER + SISTEM ANTRIAN
========================================================= */

let audioSedangMain = null;

let audioQueue = [];

let audioSedangDiproses = false;


/*
    Ini fungsi utama antrean.

    Audio TIDAK PERNAH dipotong.

    Kalau event azan tertahan karena audio sebelumnya
    masih berjalan, maka azan akan diberi jeda 12 detik
    setelah audio sebelumnya benar-benar selesai.
*/

async function prosesAntrianAudio(){

    if(audioSedangDiproses)
        return;

    if(audioSedangMain)
        return;

    if(audioQueue.length === 0)
        return;


    audioSedangDiproses = true;


    const item =
        audioQueue.shift();


    /*
        Kalau item adalah azan yang tertahan
        karena audio sebelumnya masih berjalan,
        tunggu 12 detik SEBELUM azan.
    */

    if(
        item.jedaSebelumPlay &&
        item.jedaSebelumPlay > 0
    ){

        document.getElementById(
            "statusAudio"
        ).innerHTML =
            "⏳ Menunggu " +
            item.jedaSebelumPlay +
            " detik sebelum azan...";


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    item.jedaSebelumPlay * 1000
                )
        );

    }


    let data = null;


    try{

        data =
            await ambilAudio(
                item.id
            );

    }catch(error){

        console.error(error);

    }


    if(!data){

        document.getElementById(
            "statusAudio"
        ).innerHTML =
            "⚠ Audio belum dipasang: " +
            item.id;


        audioSedangDiproses = false;


        setTimeout(
            prosesAntrianAudio,
            0
        );


        return;

    }


    const url =
        URL.createObjectURL(
            data.file
        );


    const audio =
        new Audio(url);


    audio.volume = 1;

    audioSedangMain =
        audio;


    document.getElementById(
        "statusAudio"
    ).innerHTML =
        item.isAdzan
        ?
        "🔊 AZAN: " + data.nama
        :
        "🔊 Memutar: " + data.nama;


    function selesai(){

        URL.revokeObjectURL(
            url
        );


        if(audioSedangMain === audio){

            audioSedangMain = null;

        }


        audioSedangDiproses = false;


        document.getElementById(
            "statusAudio"
        ).innerHTML =
            audioQueue.length > 0
            ?
            "⏳ Menunggu audio berikutnya..."
            :
            "🟢 Audio selesai";


        setTimeout(
            prosesAntrianAudio,
            0
        );

    }


    audio.onended =
        selesai;


    audio.onerror =
        selesai;


    try{

        await audio.play();

    }catch(error){

        console.log(error);

        selesai();

        return;

    }


    /*
        Audio sudah mulai berjalan.
        Lock proses dilepas supaya sistem
        tahu audio sedang aktif lewat
        audioSedangMain.
    */

    audioSedangDiproses = false;

}


/* =========================================================
   MASUKKAN AUDIO KE ANTRIAN
========================================================= */

function masukkanKeAntrian(item){

    /*
        Jangan masukkan event yang sama dua kali.
    */

    if(
        sudahDiputar[item.key]
    )
        return;


    /*
        Tandai sebagai sudah dimasukkan
        ke antrean.
    */

    sudahDiputar[item.key] = true;


    audioQueue.push(item);


    /*
        Urutkan berdasarkan waktu target.
        Kalau target sama, urutan masuk dipertahankan.
    */

    audioQueue.sort(
        (a,b)=>{

            if(a.target !== b.target)

                return a.target - b.target;


            return a.urutan - b.urutan;

        }
    );


    /*
        Kalau event azan masuk ketika
        masih ada audio yang sedang berjalan
        ATAU sudah ada antrean sebelumnya,
        azan harus diberi jeda 12 detik
        setelah audio sebelum azan selesai.
    */

    if(
        item.isAdzan &&
        (
            audioSedangMain ||
            audioQueue.length > 1
        )
    ){

        item.jedaSebelumPlay = 12;

    }


    prosesAntrianAudio();

}

function tambahEvent(

    id,
    waktu,
    isAdzan = false
){

    if(!waktu)
        return;


    daftar.push({

        id:id,

        urutan:
            daftar.length

    });

}


/* =========================================================
   AUDIO OTOMATIS
========================================================= */

let audioDiizinkan = false;

let sudahDiputar = {};


function cekAudio(){

    if(!audioDiizinkan)
        return;


    const now =
        new Date();


    const hari =
        now.getDay();


    const sekarang =
        now.getHours()*3600 +
        now.getMinutes()*60 +
        now.getSeconds();


    const tanggal =
        getTanggalKey(now);


    const daftar = [];


    /*
        AUDIO SUBUH
    */

    tambahEvent(
        daftar,
        "audioSubuh",
        getJamAudioSubuh(),
        false
    );


    /*
        AZAN SUBUH
        Target = Subuh + 12 detik
    */

    tambahEvent(
        daftar,
        "adzanSubuh",
        getJamAdzan("subuh"),
        true
    );


    /*
        JUMAT
    */

    if(hari === 5){

        tambahEvent(
            daftar,
            "jumatan",
            getJamAudio("jumatan"),
            false
        );

    }else{

        /*
            AZAN DZUHUR
        */

        tambahEvent(
            daftar,
            "adzanUmum",
            getJamAdzan("dzuhur"),
            true
        );


        /*
            AUDIO DZUHUR
        */

        tambahEvent(
            daftar,
            "audioDzuhur",
            getJamAudio("dzuhur"),
            false
        );

    }


    /*
        AZAN ASHAR
    */

    tambahEvent(
        daftar,
        "adzanUmum",
        getJamAdzan("ashar"),
        true
    );


    /*
        AUDIO ASHAR
    */

    tambahEvent(
        daftar,
        "audioAshar",
        getJamAudio("ashar"),
        false
    );


    /*
        AZAN MAGHRIB
    */

    tambahEvent(
        daftar,
        "adzanUmum",
        getJamAdzan("maghrib"),
        true
    );


    /*
        KAMIS:
        YASIN menggantikan AUDIO MAGHRIB
    */

    if(hari === 4){

        tambahEvent(
            daftar,
            "yasin",
            getJamAudio("yasin"),
            false
        );

    }else{

        tambahEvent(
            daftar,
            "audioMaghrib",
            getJamAudio("maghrib"),
            false
        );

    }


    /*
        AZAN ISYA
    */

    tambahEvent(
        daftar,
        "adzanUmum",
        getJamAdzan("isya"),
        true
    );


    /*
        AUDIO ISYA
    */

    tambahEvent(
        daftar,
        "audioIsya",
        getJamAudio("isya"),
        false
    );


    /*
        =====================================================
        LOGIKA PENTING
        =====================================================

        Normal:
        target 04:00:12
        → langsung play pada 04:00:12

        Kalau audio sedang berjalan:
        target 04:00:12
        → azan dimasukkan antrean
        → audio selesai 04:03:15
        → tunggu 12 detik
        → azan 04:03:27
    */


    for(const item of daftar){

        const target =
            waktuKeDetik(
                item.waktu
            );


        const key =
            tanggal +
            "_" +
            item.id +
            "_" +
            target;


        if(
            sekarang >= target &&
            !sudahDiputar[key]
        ){

            /*
                Dalam 3 detik pertama:
                event normal langsung masuk.

                Kalau target sudah lewat tetapi
                masih ada audio yang sedang berjalan
                atau sudah ada antrean, event tetap
                dimasukkan.

                Ini yang membuat azan tidak hilang
                ketika audio sebelumnya panjang.
            */

            const targetBaruSajaLewat =
                sekarang < target + 3;


            const adaAudioSebelumnya =
                !!audioSedangMain ||
                audioQueue.length > 0;


            if(
                targetBaruSajaLewat ||
                adaAudioSebelumnya
            ){

                masukkanKeAntrian({

                    id:item.id,

                    waktu:item.waktu,

                    target:target,

                    key:key,

                    isAdzan:item.isAdzan,

                    jedaSebelumPlay:0,

                    urutan:item.urutan

                });

            }

        }

    }

}

/* =========================================================
   COUNTDOWN
========================================================= */

function updateCountdown(){

    const now =
        new Date();


    const daftar = [

        {
            nama:"Subuh",
            waktu:jadwal.subuh
        }

    ];


    if(

        now.getDay() === 5 &&
        sedangJumatan()

    ){

        daftar.push({

            nama:"Jumatan",

            waktu:getJamJumatan()

        });

    }else{

        daftar.push({

            nama:"Dzuhur",

            waktu:jadwal.dzuhur

        });

    }


    daftar.push(

        {
            nama:"Ashar",
            waktu:jadwal.ashar
        },

        {
            nama:"Maghrib",
            waktu:jadwal.maghrib
        },

        {
            nama:"Isya",
            waktu:jadwal.isya
        }

    );


    let berikutnya = null;

    let nama = "";


    for(const item of daftar){

        const p =
            item.waktu
            .split(":")
            .map(Number);


        const target =
            new Date();


        target.setHours(
            p[0],
            p[1],
            p[2] || 0,
            0
        );


        if(target > now){

            berikutnya =
                target;

            nama =
                item.nama;

            break;

        }

    }


    if(!berikutnya){

        const p =
            daftar[0]
            .waktu
            .split(":")
            .map(Number);


        berikutnya =
            new Date();


        berikutnya.setDate(
            berikutnya.getDate()+1
        );


        berikutnya.setHours(
            p[0],
            p[1],
            0,
            0
        );


        nama =
            daftar[0].nama;

    }


    const selisih =
        berikutnya - now;


    const jam =
        Math.floor(
            selisih / 3600000
        );


    const menit =
        Math.floor(

            (selisih % 3600000) /
            60000

        );


    const detik =
        Math.floor(

            (selisih % 60000) /
            1000

        );


    document.getElementById(
        "countdown"
    ).innerHTML =

        nama +
        " — " +

        String(jam).padStart(2,"0") +
        ":" +

        String(menit).padStart(2,"0") +
        ":" +

        String(detik).padStart(2,"0");

}

/* =========================================================
   CEK HARI BARU
========================================================= */

let tanggalTerakhir =
    getTanggalKey(
        new Date()
    );


function cekHariBaru(){

    const sekarang =
        getTanggalKey(
            new Date()
        );


    if(
        sekarang !==
        tanggalTerakhir
    ){

        tanggalTerakhir =
            sekarang;


        sudahDiputar = {};

        /*
            Bersihkan antrean lama saat berganti hari.
        */

        audioQueue = [];


        updateJadwal();

        updateTanggal();

        updatePasaran();

        updateCountdown();

        updateAudioTimes();

    }

}


/* =========================================================
   START
========================================================= */

async function start(){

    try{

        await bukaDatabase();

        buatAudioSettings();

        await buatPanel();

    }catch(error){

        console.error(error);

    }


    updateJadwal();

    updateJam();

    updateTanggal();

    updatePasaran();

    updateCountdown();


    setInterval(
        updateJam,
        1000
    );


    setInterval(
        updateTanggal,
        1000
    );


    setInterval(
        tampilJadwal,
        1000
    );


    setInterval(
        updateCountdown,
        1000
    );


    setInterval(
        cekAudio,
        1000
    );


    setInterval(
        cekHariBaru,
        1000
    );


    setInterval(
        updateAudioTimes,
        1000
    );

}


window.onload =
    start;

</script>
