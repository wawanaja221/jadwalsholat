/* =========================================================
   KONVERSI
========================================================= */

function waktuKeDetik(waktu){

    const p =
        waktu.split(":").map(Number);

    return (
        p[0] * 3600 +
        p[1] * 60 +
        (p[2] || 0)
    );

}


function detikKeWaktu(total){

    total =
        ((total % 86400) + 86400) % 86400;

    const jam =
        Math.floor(total / 3600);

    const menit =
        Math.floor(
            (total % 3600) / 60
        );

    const detik =
        total % 60;

    return (

        String(jam).padStart(2,"0") +
        ":" +
        String(menit).padStart(2,"0") +
        ":" +
        String(detik).padStart(2,"0")

    );

}


/* =========================================================
   OFFSET AUDIO
========================================================= */

const OFFSET = {

    /* SUBUH
       03:33:29 - 04:17:00
       = -43 menit 31 detik
    */

    subuh:
        waktuKeDetik(AUDIO_ACUAN.subuh) -
        waktuKeDetik(SHOLAT_ACUAN.subuh),

    dzuhur:
        waktuKeDetik(AUDIO_ACUAN.dzuhur) -
        waktuKeDetik(SHOLAT_ACUAN.dzuhur),

    ashar:
        waktuKeDetik(AUDIO_ACUAN.ashar) -
        waktuKeDetik(SHOLAT_ACUAN.ashar),

    maghrib:
        waktuKeDetik(AUDIO_ACUAN.maghrib) -
        waktuKeDetik(SHOLAT_ACUAN.maghrib),

    isya:
        waktuKeDetik(AUDIO_ACUAN.isya) -
        waktuKeDetik(SHOLAT_ACUAN.isya),

    yasin:
        waktuKeDetik(AUDIO_ACUAN.yasin) -
        waktuKeDetik(SHOLAT_ACUAN.maghrib),

    jumatan:
        waktuKeDetik(AUDIO_ACUAN.jumatan) -
        waktuKeDetik(SHOLAT_ACUAN.jumatan),

    adzanSubuh:
        waktuKeDetik(AUDIO_ACUAN.adzanSubuh) -
        waktuKeDetik(SHOLAT_ACUAN.subuh)

};


/* =========================================================
   TANGGAL
========================================================= */

function getTanggalKey(date){

    return (

        date.getFullYear() +
        "-" +
        String(date.getMonth()+1).padStart(2,"0") +
        "-" +
        String(date.getDate()).padStart(2,"0")

    );

}


/* =========================================================
   AMBIL JADWAL
========================================================= */

function ambilJadwalTanggal(date){

    const key =
        getTanggalKey(date);

    if(DATA_JADWAL[key]){
        return DATA_JADWAL[key];
    }

    return null;

}


/* =========================================================
   UPDATE JADWAL
========================================================= */

function updateJadwal(){

    const data =
        ambilJadwalTanggal(new Date());

    if(data){

        jadwal.imsak   = data[0];
        jadwal.subuh   = data[1];
        jadwal.dzuhur  = data[2];
        jadwal.ashar   = data[3];
        jadwal.maghrib = data[4];
        jadwal.isya    = data[5];

    }

    tampilJadwal();

    updateAudioTimes();

}


/* =========================================================
   HITUNG WAKTU AUDIO
========================================================= */

function hitungAudio(waktuSholat,offset){

    return detikKeWaktu(

        waktuKeDetik(
            waktuSholat + ":00"
        ) + offset

    );

}


/* =========================================================
   WAKTU AUDIO SUBUH
========================================================= */

function getJamAudioSubuh(){

    return hitungAudio(
        jadwal.subuh,
        OFFSET.subuh
    );

}


/* =========================================================
   WAKTU AUDIO LAIN
========================================================= */

function getJamAudio(jenis){

    if(jenis === "dzuhur")
        return hitungAudio(
            jadwal.dzuhur,
            OFFSET.dzuhur
        );

    if(jenis === "ashar")
        return hitungAudio(
            jadwal.ashar,
            OFFSET.ashar
        );

    if(jenis === "maghrib")
        return hitungAudio(
            jadwal.maghrib,
            OFFSET.maghrib
        );

    if(jenis === "isya")
        return hitungAudio(
            jadwal.isya,
            OFFSET.isya
        );

    if(jenis === "yasin")
        return hitungAudio(
            jadwal.maghrib,
            OFFSET.yasin
        );

    if(jenis === "jumatan")
        return hitungAudio(
            "11:35",
            OFFSET.jumatan
        );

    return null;

}


/* =========================================================
   WAKTU ADZAN
========================================================= */

function getJamAdzan(jenis){

    if(jenis === "subuh"){

        return hitungAudio(
            jadwal.subuh,
            OFFSET.adzanSubuh
        );

    }

    if(jenis === "dzuhur"){

        return jadwal.dzuhur + ":00";

    }

    if(jenis === "ashar"){

        return jadwal.ashar + ":00";

    }

    if(jenis === "maghrib"){

        return jadwal.maghrib + ":00";

    }

    if(jenis === "isya"){

        return jadwal.isya + ":00";

    }

    return null;

}


/* =========================================================
   TAMPIL JADWAL

/* =========================================================
   INDEXED DB
========================================================= */

let db = null;


function bukaDatabase(){

    return new Promise((resolve,reject)=>{

        const request =
            indexedDB.open(
                "JadwalSholatAudio",
                3
            );


        request.onupgradeneeded =
        function(e){

            const database =
                e.target.result;

            if(
                !database.objectStoreNames.contains("audio")
            ){

                database.createObjectStore(
                    "audio",
                    {keyPath:"id"}
                );

            }

        };


        request.onsuccess =
        function(e){

            db =
                e.target.result;

            resolve();

        };


        request.onerror =
        function(){

            reject(request.error);

        };

    });

}


/* =========================================================
   SIMPAN AUDIO
========================================================= */

function simpanAudio(id,file){

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction(
                "audio",
                "readwrite"
            );

        tx.objectStore("audio").put({

            id:id,
            nama:file.name,
            file:file

        });

        tx.oncomplete =
            ()=>resolve();

        tx.onerror =
            ()=>reject(tx.error);

    });

}


/* =========================================================
   AMBIL AUDIO
========================================================= */

function ambilAudio(id){

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction(
                "audio",
                "readonly"
            );

        const request =
            tx.objectStore("audio").get(id);

        request.onsuccess =
            ()=>{
                resolve(request.result);
            };

        request.onerror =
            ()=>{
                reject(request.error);
            };

    });

}


/* =========================================================
   HAPUS
========================================================= */

function hapusAudio(id){

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction(
                "audio",
                "readwrite"
            );

        tx.objectStore("audio").delete(id);

        tx.oncomplete =
            ()=>resolve();

        tx.onerror =
            ()=>reject(tx.error);

    });

}

/* =========================================================
   BUAT PANEL
========================================================= */

async function buatPanel(){

    const panel =
        document.getElementById(
            "audioBlocks"
        );

    panel.innerHTML = "";


    for(const item of AUDIO_LIST){

        const div =
            document.createElement("div");

        div.className =
            "slot";

        div.innerHTML = `

            <strong>${item.nama}</strong>

            <br>

            <input
                type="file"
                id="file_${item.id}"
                accept="audio/*"
            >

            <div
                class="auto"
                id="auto_${item.id}"
            ></div>

            <div
                class="info"
                id="info_${item.id}"
            ></div>

            <button
                onclick="testAudio('${item.id}')"
            >
                ▶ TEST
            </button>

            <button
                onclick="hapusFile('${item.id}')"
            >
                🗑 HAPUS
            </button>

        `;

        panel.appendChild(div);


        document.getElementById(
            "file_" + item.id
        ).addEventListener(
            "change",
            async function(){

                const file =
                    this.files[0];

                if(!file)
                    return;

                await simpanAudio(
                    item.id,
                    file
                );

                document.getElementById(
                    "info_" + item.id
                ).innerHTML =
                    "Tersimpan: " +
                    file.name;

            }
        );


        const old =
            await ambilAudio(item.id);


        if(old){

            document.getElementById(
                "info_" + item.id
            ).innerHTML =
                "Tersimpan: " +
                old.nama;

        }else{

            document.getElementById(
                "info_" + item.id
            ).innerHTML =
                "Belum ada audio";

        }

    }


    updateAudioTimes();

}

/* =========================================================
   AUDIO PLAYER
========================================================= */

let audioSedangMain = null;


async function playAudio(id){

    const data =
        await ambilAudio(id);


    if(!data){

        document.getElementById(
            "statusAudio"
        ).innerHTML =
            "⚠ Audio " +
            id +
            " belum dipasang";

        return;

    }


    if(audioSedangMain){

        audioSedangMain.pause();

        audioSedangMain.currentTime = 0;

    }


    const url =
        URL.createObjectURL(data.file);


    const audio =
        new Audio(url);


    audio.volume = 1;

    audioSedangMain =
        audio;


    document.getElementById(
        "statusAudio"
    ).innerHTML =
        "🔊 Memutar: " +
        data.nama;


    audio.onended =
    function(){

        URL.revokeObjectURL(url);

        audioSedangMain = null;

        document.getElementById(
            "statusAudio"
        ).innerHTML =
            "🟢 Audio selesai";

    };


    try{

        await audio.play();

    }catch(error){

        console.log(error);

        document.getElementById(
            "statusAudio"
        ).innerHTML =
            "⚠ Browser belum mengizinkan audio otomatis";

    }

}

========================================================= */

function tambahEvent(
    daftar,
    id,
    waktu,
    keterangan
){

    if(!waktu)
        return;

    daftar.push({

        id:id,
        waktu:waktu,
        keterangan:keterangan

    });

}


/* =========================================================

========================================================= */

let audioDiizinkan = false;

let sudahDiputar = {};

        return;

    const hari =
        now.getDay();


    const sekarang =
        now.getHours()*3600 +

    /* =====================================================
       JALANKAN
    ===================================================== */

    for(const item of daftar){

            waktuKeDetik(item.waktu);


        const key =
            tanggal +
            "_" +
            item.id;


        if(

            sekarang >= target &&

            sekarang < target + 3 &&

            !sudahDiputar[key]

        ){

            sudahDiputar[key] = true;

            playAudio(item.id);

        }

    }

}


/* =========================================================
   JAM
========================================================= */

function updateJam(){

    document.getElementById(
        "jam"
    ).innerHTML =
        new Date().toLocaleTimeString("id-ID");

}


/* =========================================================
   TANGGAL + HIJRI
========================================================= */

function updateTanggal(){

    const now =
        new Date();

    let hijri = "";

    try{

        const h =
            new Date(now);

        /*
           Koreksi tanggal Hijriyah -1
        */

        h.setDate(
            h.getDate() - 1
        );


        hijri =
            new Intl.DateTimeFormat(

                "id-TN-u-ca-islamic",

                {
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }

            ).format(h);

    }catch(e){

        hijri = "";

    }


    const masehi =
        now.toLocaleDateString(
            "id-ID",
            {
                weekday:"long",
                day:"numeric",
                month:"long",
                year:"numeric"
            }
        );


    document.getElementById(
        "tanggal"
    ).innerHTML =
        masehi +
        " | " +
        hijri;

}


/* =========================================================
   PASARAN
========================================================= */

function updatePasaran(){

    const pasaran = [

        "Legi",
        "Pahing",
        "Pon",
        "Wage",
        "Kliwon"

    ];


    const awal =
        new Date(
            1970,
            0,
            1
        );


    const sekarang =
        new Date();


    const selisih =
        Math.floor(
            (sekarang - awal) /
            86400000
        );


    const index =
        (selisih + 3) % 5;


    document.getElementById(
        "kalenderJawa"
    ).innerHTML =
        "Pasaran: " +
        pasaran[index];

}


/* =========================================================
   COUNTDOWN
========================================================= */

function updateCountdown(){

    const now =
        new Date();


    const daftar = [

        {
            nama:"Subuh",
            waktu:jadwal.subuh
        }

    ];


    if(now.getDay() === 5){

        daftar.push({

            nama:"Jumatan",
            waktu:"11:35"

        });

    }else{

        daftar.push({

            nama:"Dzuhur",
            waktu:jadwal.dzuhur

        });

    }


    daftar.push({

        nama:"Ashar",
        waktu:jadwal.ashar

    });


    daftar.push({

        nama:"Maghrib",
        waktu:jadwal.maghrib

    });


    daftar.push({

        nama:"Isya",
        waktu:jadwal.isya

    });


    let berikutnya = null;
    let nama = "";


    for(const item of daftar){

        const p =
            item.waktu
            .split(":")
            .map(Number);


        const target =
            new Date();


        target.setHours(
            p[0],
            p[1],
            0,
            0
        );


        if(target > now){

            berikutnya =
                target;

            nama =
                item.nama;

            break;

        }

    }


    if(!berikutnya){

        const p =
            daftar[0]
            .waktu
            .split(":")
            .map(Number);


        berikutnya =
            new Date();


        berikutnya.setDate(
            berikutnya.getDate()+1
        );


        berikutnya.setHours(
            p[0],
            p[1],
            0,
            0
        );


        nama =
            daftar[0].nama;

    }


    const selisih =
        berikutnya - now;


    const jam =
        Math.floor(
            selisih / 3600000
        );


    const menit =
        Math.floor(
            (selisih % 3600000) /
            60000
        );


    const detik =
        Math.floor(
            (selisih % 60000) /
            1000
        );


    document.getElementById(
        "countdown"
    ).innerHTML =

        "Menuju " +
        nama +
        " " +

        String(jam).padStart(2,"0") +
        ":" +

        String(menit).padStart(2,"0") +
        ":" +

        String(detik).padStart(2,"0");

}

/* =========================================================
   DETEKSI HARI BERGANTI
========================================================= */

let tanggalTerakhir =
    getTanggalKey(new Date());


function cekHariBaru(){

    const sekarang =
        getTanggalKey(new Date());


    if(
        sekarang !==
        tanggalTerakhir
    ){

        tanggalTerakhir =
            sekarang;

        sudahDiputar = {};

        updateJadwal();

        updateTanggal();

        updatePasaran();

        updateCountdown();

        updateAudioTimes();

    }

}


/* =========================================================
   START
========================================================= */

async function start(){

    try{

        await bukaDatabase();

        await buatPanel();

    }catch(error){

        console.error(error);

    }


    updateJadwal();

    updateJam();

    updateTanggal();

    updatePasaran();

    updateCountdown();


    setInterval(
        updateJam,
        1000
    );


    setInterval(
        tampilJadwal,
        1000
    );


    setInterval(
        updateCountdown,
        1000
    );


    setInterval(
        cekAudio,
        1000
    );


    setInterval(
        cekHariBaru,
        1000
    );


    setInterval(
        updateAudioTimes,
        1000
    );

}


window.onload = start;
