/* =========================================================
   KONVERSI WAKTU
========================================================= */

function waktuKeDetik(waktu){

    const p =
        waktu.split(":").map(Number);

    return (
        p[0] * 3600 +
        p[1] * 60 +
        (p[2] || 0)
    );

}


function detikKeWaktu(total){

    total =
        ((total % 86400) + 86400) % 86400;

    const jam =
        Math.floor(total / 3600);

    const menit =
        Math.floor(
            (total % 3600) / 60
        );

    const detik =
        total % 60;

    return (

        String(jam).padStart(2,"0") +

        ":" +

        String(menit).padStart(2,"0") +

        ":" +

        String(detik).padStart(2,"0")

    );

}

/* =========================================================
   TANGGAL KEY
========================================================= */

function getTanggalKey(date){

    return (

        date.getFullYear() +

        "-" +

        String(
            date.getMonth()+1
        ).padStart(2,"0") +

        "-" +

        String(
            date.getDate()
        ).padStart(2,"0")

    );

}


/* =========================================================
   CARI JADWAL
========================================================= */

function ambilJadwalTanggal(date){

    const key =
        getTanggalKey(date);


    /*
       Kalau tersedia langsung pakai.
    */

    if(DATA_JADWAL[key]){

        return DATA_JADWAL[key];

    }


    /*
       Kalau tanggal belum tersedia,
       cari tanggal terdekat yang sudah ada.

       Tidak membuat angka palsu.
    */

    const keys =
        Object.keys(DATA_JADWAL);


    let terdekat =
        null;

    let jarak =
        Infinity;


    for(
        const k of keys
    ){

        const d =
            new Date(k);


        const j =
            Math.abs(
                d.getTime() -
                date.getTime()
            );


        if(j < jarak){

            jarak = j;

            terdekat = k;

        }

    }


    if(terdekat){

        return DATA_JADWAL[
            terdekat
        ];

    }


    return null;

}


/* =========================================================
   UPDATE JADWAL
========================================================= */

function updateJadwal(){

    const now =

            ashar:data[2],

            maghrib:data[3],

            isya:data[4]

    }


    tampilJadwal();

    updateAudioTimes();

}


/* =========================================================
   JAM AUDIO
========================================================= */

function hitungAudio(
    waktuSholat,
    offset
){

    return detikKeWaktu(

        waktuKeDetik(
            waktuSholat + ":00"
        )
        +
        offset

    );

}

/* =========================================================
   INDEXED DB
========================================================= */

let db = null;


function bukaDatabase(){

    return new Promise(
        (resolve,reject)=>{

            const request =
                indexedDB.open(
                    "JadwalSholatAudio",
                    2
                );


            request.onupgradeneeded =
            function(e){

                const database =
                    e.target.result;


                if(
                    !database.objectStoreNames.contains(
                        "audio"
                    )
                ){

                    database.createObjectStore(
                        "audio",
                        {
                            keyPath:"id"
                        }
                    );

                }

            };


            request.onsuccess =
            function(e){

                db =
                    e.target.result;

                resolve();

            };


            request.onerror =
            function(){

                reject(
                    request.error
                );

            };

        }
    );

}


/* =========================================================
   SIMPAN AUDIO
========================================================= */

function simpanAudio(
    id,
    file
){

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    "audio",
                    "readwrite"
                );


            tx.objectStore(
                "audio"
            ).put({

                id:id,

                nama:file.name,

                file:file

            });


            tx.oncomplete =
                ()=>resolve();


            tx.onerror =
                ()=>reject(
                    tx.error
                );

        }
    );

}


/* =========================================================
   AMBIL AUDIO
========================================================= */

function ambilAudio(
    id
){

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    "audio",
                    "readonly"
                );


            const request =
                tx.objectStore(
                    "audio"
                ).get(id);


            request.onsuccess =
                ()=>{
                    resolve(
                        request.result
                    );
                };


            request.onerror =
                ()=>{
                    reject(
                        request.error
                    );
                };

        }
    );

}


/* =========================================================
   HAPUS AUDIO
========================================================= */

function hapusAudio(
    id
){

    return new Promise(
        (resolve,reject)=>{

            const tx =
                db.transaction(
                    "audio",
                    "readwrite"
                );


            tx.objectStore(
                "audio"
            ).delete(id);


            tx.oncomplete =
                ()=>resolve();


            tx.onerror =
                ()=>reject(
                    tx.error
                );

        }
    );

}

/* =========================================================
   BUAT PANEL
========================================================= */

async function buatPanel(){

    const panel =
        document.getElementById(
            "audioBlocks"
        );


    panel.innerHTML = "";


    for(
        const item of AUDIO_LIST
    ){

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "slot";


        div.innerHTML = `

            <strong>
                ${item.nama}
            </strong>

            <br>

            <input
                type="file"
                id="file_${item.id}"
                accept="audio/*"
            >

            <div
                class="auto"
                id="auto_${item.id}"
            ></div>

            <div
                class="info"
                id="info_${item.id}"
            ></div>

            <button
                onclick="testAudio('${item.id}')"
            >
                ▶ TEST
            </button>

            <button
                onclick="hapusFile('${item.id}')"
            >
                🗑 HAPUS
            </button>

        `;


        panel.appendChild(div);


        document.getElementById(
            "file_" +
            item.id
        ).addEventListener(
            "change",
            async function(){

                const file =
                    this.files[0];


                if(!file)
                    return;


                await simpanAudio(
                    item.id,
                    file
                );


                document.getElementById(
                    "info_" +
                    item.id
                ).innerHTML =

                    "Tersimpan: " +
                    file.name;

            }
        );


        const old =
            await ambilAudio(
                item.id
            );


        if(old){

            document.getElementById(
                "info_" +
                item.id
            ).innerHTML =

                "Tersimpan: " +
                old.nama;

        }else{

            document.getElementById(
                "info_" +
                item.id
            ).innerHTML =

                "Belum ada audio";

        }

    }


    updateAudioTimes();

}

/* =========================================================
   AUDIO PLAYER
========================================================= */

let audioSedangMain =
    null;


async function playAudio(
    id
){

    const data =
        await ambilAudio(
            id
        );


    if(!data){

        document.getElementById(
            "statusAudio"
        ).innerHTML =

            "⚠ Audio " +
            id +
            " belum dipasang";

        return;

    }


    if(audioSedangMain){

        audioSedangMain.pause();

        audioSedangMain.currentTime =
            0;

    }


    const url =
        URL.createObjectURL(
            data.file
        );


    const audio =
        new Audio(url);


    audio.volume =
        1;


    audioSedangMain =
        audio;


    document.getElementById(
        "statusAudio"
    ).innerHTML =

        "🔊 Memutar: " +
        data.nama;


    audio.onended =
    function(){

        URL.revokeObjectURL(
            url
        );


        audioSedangMain =
            null;


        document.getElementById(
            "statusAudio"
        ).innerHTML =

            "🟢 Audio selesai — sistem normal lagi";

    };


    try{

        await audio.play();

    }catch(error){

        console.log(error);


        document.getElementById(
            "statusAudio"
        ).innerHTML =

            "⚠ Browser belum mengizinkan audio otomatis";

    }

}

    id
){

    await hapusAudio(
        id
    );


    await buatPanel();

}


/* =========================================================
   AUDIO OTOMATIS
========================================================= */

let audioDiizinkan =
    false;


let sudahDiputar =
    {};


/* =========================================================
   TAMBAH EVENT AUDIO
========================================================= */

function tambahEvent(
    daftar,
    id,
    jenis,
    waktu,
    keterangan
){

    if(!waktu)
        return;


    daftar.push({

        id:id,

        jenis:jenis,

        waktu:waktu,

        keterangan:keterangan

    });

}


/* =========================================================
   CEK AUDIO
========================================================= */

function cekAudio(){

    if(!audioDiizinkan)
        return;


    const now =
        new Date();


    const hari =
        now.getDay();


    const sekarang =
        now.getHours()*3600 +

        now.getMinutes()*60 +

        now.getSeconds();


    const tanggal =
        getTanggalKey(
            now
        );


    const daftar = [];


    /* =====================================================
       SUBUH
       ADZAN SUBUH + AUDIO SUBUH
       ===================================================== */

    tambahEvent(

        daftar,

        "adzanSubuh",

        "adzanSubuh",

        getJamAdzan("subuh"),

        "Adzan Subuh"

    );


    /*
       Audio khusus setelah/sebelum Subuh
       TIDAK lagi dipakai sebagai audio biasa.
       Kalau ingin audio khusus Subuh tambahan,
       tempatnya adalah slot adzanSubuh.
    */


    /* =====================================================
       DZUHUR
       ===================================================== */

    if(hari === 5){

        /*
           JUMAT

           Adzan umum tetap ON.
           Audio biasa Dzuhur diganti Jumatan.
        */

        tambahEvent(

            daftar,

            "adzanUmum",

            "adzanJumat",

            getJamAdzan("dzuhur"),

            "Adzan Jumat"

        );


        tambahEvent(

            daftar,

            "jumatan",

            "jumatan",

            getJamAudio("jumatan"),

            "Audio Jumatan"

        );

    }else{

        /*
           SENIN-KAMIS + SABTU-MINGGU
        */

        tambahEvent(

            daftar,

            "adzanUmum",

            "adzanDzuhur",

            getJamAdzan("dzuhur"),

            "Adzan Dzuhur"

        );


        tambahEvent(

            daftar,

            "audioDzuhur",

            "audioDzuhur",

            getJamAudio("dzuhur"),

            "Audio Dzuhur"

        );

    }


    /* =====================================================
       ASHAR
       ===================================================== */

    tambahEvent(

        daftar,

        "adzanUmum",

        "adzanAshar",

        getJamAdzan("ashar"),

        "Adzan Ashar"

    );


    tambahEvent(

        daftar,

        "audioAshar",

        "audioAshar",

        getJamAudio("ashar"),

        "Audio Ashar"

    );


    /* =====================================================
       MAGHRIB
       ===================================================== */

    tambahEvent(

        daftar,

        "adzanUmum",

        "adzanMaghrib",

        getJamAdzan("maghrib"),

        "Adzan Maghrib"

    );


    if(hari === 4){

        /*
           KAMIS MAGHRIB

           ADZAN UMUM TETAP ON.

           AUDIO MAGHRIB BIASA OFF.

           DIGANTI YASIN.
        */

        tambahEvent(

            daftar,

            "yasin",

            "yasin",

            getJamAudio("yasin"),

            "Yasin Kamis"

        );

    }else{

        tambahEvent(

            daftar,

            "audioMaghrib",

            "audioMaghrib",

            getJamAudio("maghrib"),

            "Audio Maghrib"

        );

    }


    /* =====================================================
       ISYA
       ===================================================== */

    tambahEvent(

        daftar,

        "adzanUmum",

        "adzanIsya",

        getJamAdzan("isya"),

        "Adzan Isya"

    );


    tambahEvent(

        daftar,

        "audioIsya",

        "audioIsya",

        getJamAudio("isya"),

        "Audio Isya"

    );


    /* =====================================================
       JALANKAN EVENT
       ===================================================== */

    for(
        const item of daftar
    ){

        const target =
            waktuKeDetik(
                item.waktu
            );


        const key =
            tanggal +
            "_" +
            item.id +
            "_" +
            item.jenis;


        /*
           Window 3 detik.

           Jadi kalau halaman dicek setiap 1 detik,
           audio tetap hanya diputar sekali.
        */

        if(

            sekarang >= target &&

            sekarang <
            target + 3 &&

            !sudahDiputar[key]

        ){

            sudahDiputar[key] =
                true;


            playAudio(
                item.id
            );

        }

    }

}


/* =========================================================
   JAM DIGITAL
========================================================= */

function updateJam(){

    const now =
        new Date();


    document.getElementById(
        "jam"
    ).innerHTML =

        now.toLocaleTimeString(
            "id-ID"
        );

}


/* =========================================================
   TANGGAL
========================================================= */

function updateTanggal(){

    const now =
        new Date();


    let hijri =
        "";


    try{

        /*
           Koreksi -1 hari.
        */

        const h =
            new Date(now);


        h.setDate(
            h.getDate() - 1
        );


        hijri =

            new Intl.DateTimeFormat(

                "id-TN-u-ca-islamic",

                {

                    day:"numeric",

                    month:"long",

                    year:"numeric"

                }

            ).format(h);

    }catch(e){

        hijri =
            "";

    }


    const masehi =

        now.toLocaleDateString(

            "id-ID",

            {

                weekday:"long",

                day:"numeric",

                month:"long",

                year:"numeric"

            }

        );


    document.getElementById(
        "tanggal"
    ).innerHTML =

        masehi +

        " | " +

        hijri;

}


/* =========================================================
   PASARAN
========================================================= */

function updatePasaran(){

    const pasaran = [

        "Legi",

        "Pahing",

        "Pon",

        "Wage",

        "Kliwon"

    ];


    const awal =
        new Date(
            1970,
            0,
            1
        );


    const sekarang =
        new Date();


    const selisih =
        Math.floor(

            (
                sekarang -
                awal
            )
            /
            86400000

        );


    const index =
        (
            selisih +
            3
        ) % 5;


    document.getElementById(
        "kalenderJawa"
    ).innerHTML =

        "Pasaran: " +
        pasaran[index];

}


/* =========================================================
   COUNTDOWN
========================================================= */

function updateCountdown(){

    const now =
        new Date();


    const daftar = [

        {
            nama:"Subuh",

            waktu:
                jadwal.subuh

        }

    ];


    if(
        now.getDay() === 5
    ){

        daftar.push({

            nama:"Jumatan",

            waktu:"11:35"

        });

    }else{

        daftar.push({

            nama:"Dzuhur",

            waktu:
                jadwal.dzuhur

        });

    }


    daftar.push({

        nama:"Ashar",

        waktu:
            jadwal.ashar

    });


    daftar.push({

        nama:"Maghrib",

        waktu:
            jadwal.maghrib

    });


    daftar.push({

        nama:"Isya",

        waktu:
            jadwal.isya

    });


    let berikutnya =
        null;


    let nama =
        "";


    for(
        const item of daftar
    ){

        const p =
            item.waktu
            .split(":")
            .map(Number);


        const target =
            new Date();


        target.setHours(

            p[0],

            p[1],

            0,

            0

        );


        if(
            target > now
        ){

            berikutnya =
                target;

            nama =
                item.nama;

            break;

        }

    }


    if(!berikutnya){

        const p =
            daftar[0]
            .waktu
            .split(":")
            .map(Number);


        berikutnya =
            new Date();


        berikutnya.setDate(

            berikutnya.getDate() +
            1

        );


        berikutnya.setHours(

            p[0],

            p[1],

            0,

            0

        );


        nama =
            daftar[0].nama;

    }


    const selisih =
        berikutnya - now;


    const jam =
        Math.floor(

            selisih /
            3600000

        );


    const menit =
        Math.floor(

            (
                selisih %
                3600000
            )
            /
            60000

        );


    const detik =
        Math.floor(

            (
                selisih %
                60000
            )
            /
            1000

        );


    document.getElementById(
        "countdown"
    ).innerHTML =

        "Menuju " +

        nama +

        " " +

        String(jam)
            .padStart(2,"0") +

        ":" +

        String(menit)
            .padStart(2,"0") +

        ":" +

        String(detik)
            .padStart(2,"0");

}


/* =========================================================
   AKTIFKAN AUDIO
========================================================= */

document.getElementById(
    "unlockAudio"
).onclick =

async function(){

    audioDiizinkan =
        true;


    this.style.display =
        "none";


    document.getElementById(
        "statusAudio"
    ).innerHTML =

        "🟢 AUDIO OTOMATIS AKTIF";

};


/* =========================================================
   SETTING
========================================================= */

document.getElementById(
    "settingBtn"
).onclick =

function(){

    const panel =
        document.getElementById(
            "audioPanel"
        );


    panel.style.display =

        panel.style.display ===
        "block"

        ?

        "none"

        :

        "block";

};


/* =========================================================
   CEK HARI BARU
========================================================= */

let tanggalTerakhir =
    getTanggalKey(
        new Date()
    );


function cekHariBaru(){

    const sekarang =
        getTanggalKey(
            new Date()
        );


    if(
        sekarang !==
        tanggalTerakhir
    ){

        tanggalTerakhir =
            sekarang;


        sudahDiputar =
            {};


        updateJadwal();

        updateTanggal();

        updatePasaran();

        updateCountdown();

        updateAudioTimes();

    }

}


/* =========================================================
   START
========================================================= */

async function start(){

    try{

        await bukaDatabase();

        await buatPanel();

    }catch(error){

        console.error(
            error
        );

    }


    updateJadwal();

    updateJam();

    updateTanggal();

    updatePasaran();

    updateCountdown();


    setInterval(

        updateJam,

        1000

    );


    setInterval(

        tampilJadwal,

        1000

    );


    setInterval(

        updateCountdown,

        1000

    );


    setInterval(

        cekAudio,

        1000

    );


    setInterval(

        cekHariBaru,

        1000

    );


    setInterval(

        updateAudioTimes,

        1000

    );

}


/* =========================================================
   JALANKAN
========================================================= */

window.onload =
    start;

</script>
