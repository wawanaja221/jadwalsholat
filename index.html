/* =====================================================
   INDEXED DB
===================================================== */

function openDatabase(){

    return new Promise(

        (resolve,reject)=>{

            const request =
                indexedDB.open(
                    "JadwalSholatAudioDB",
                    1
                );


            request.onupgradeneeded =
            function(e){

                const database =
                    e.target.result;


                if(
                    !database
                    .objectStoreNames
                    .contains("audio")
                ){

                    database
                    .createObjectStore(
                        "audio",
                        {
                            keyPath:"id"
                        }
                    );

                }

            };


            request.onsuccess =
            function(e){

                db =
                    e.target.result;

                resolve();

            };


            request.onerror =
            function(){

                reject(
                    request.error
                );

            };

        }

    );

}



function saveAudio(
    id,
    name,
    file
){

    return new Promise(

        (resolve,reject)=>{

            const tx =
                db.transaction(
                    "audio",
                    "readwrite"
                );


            tx.objectStore(
                "audio"
            ).put({

                id:id,

                name:name,

                file:file

            });


            tx.oncomplete =
                ()=>resolve();


            tx.onerror =
                ()=>reject(
                    tx.error
                );

        }

    );

}



function getAudio(id){

    return new Promise(

        (resolve,reject)=>{

            const tx =
                db.transaction(
                    "audio",
                    "readonly"
                );


            const request =
                tx.objectStore(
                    "audio"
                ).get(id);


            request.onsuccess =
                ()=>resolve(
                    request.result
                );


            request.onerror =
                ()=>reject(
                    request.error
                );

        }

    );

}



function deleteAudio(id){

    return new Promise(

        (resolve,reject)=>{

            const tx =
                db.transaction(
                    "audio",
                    "readwrite"
                );


            tx.objectStore(
                "audio"
            ).delete(id);


            tx.oncomplete =

            tx.onerror =

        }

    );

}



/* =====================================================
   AUDIO CONTEXT
===================================================== */

function initAudio(){

    if(audioCtx)
        return;


    audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    gainNode =
        audioCtx.createGain();


    gainNode.gain.value =
        Number(
            localStorage.getItem(
                "volume"
            ) || 1
        );


    gainNode.connect(
        audioCtx.destination
    );

}



async function unlockAudio(){

    initAudio();


    try{

        if(
            audioCtx.state ===
            "suspended"
        ){

            await audioCtx.resume();

        }


        audioUnlocked = true;


        document.getElementById(
            "unlock"
        ).style.display =
            "none";

    }
    catch(e){

        console.log(e);

    }

}

/* =====================================================
   CARI WAKTU SHOLAT
===================================================== */

function getWaktuSholat(nama){

    const item =
        jadwal.find(
            x =>
            x.nama === nama
        );


    return item
        ? item.waktu
        : null;

}



/* =====================================================
   KONVERSI WAKTU
===================================================== */

function waktuHariIni(waktu){

    const p =
        waktu
        .split(":")
        .map(Number);


    const d =
        new Date();


    d.setHours(
        p[0],
        p[1],
        0,
        0
    );


    return d;

}

/* =====================================================
   COUNTDOWN
===================================================== */

function updateCountdown(){

    const now =
        new Date();


    const daftar = [];


    daftar.push({

        nama:"Subuh",

        waktu:
            jadwal[0].waktu

    });


    if(
        now.getDay() === 5
    ){

        daftar.push({

            nama:"Jumatan",

            waktu:"11:35"

        });

    }
    else{

        daftar.push({

            nama:"Dzuhur",

            waktu:
                jadwal[1].waktu

        });

    }


    daftar.push({

        nama:"Ashar",

        waktu:
            jadwal[2].waktu

    });


    daftar.push({

        nama:"Maghrib",

        waktu:
            jadwal[3].waktu

    });


    daftar.push({

        nama:"Isya",

        waktu:
            jadwal[4].waktu

    });


    let target =
        null;


    let nama =
        "";


    for(
        const item of daftar
    ){

        const waktu =
            waktuHariIni(
                item.waktu
            );


        if(
            waktu > now
        ){

            target =
                waktu;

            nama =
                item.nama;

            break;

        }

    }


    if(!target){

        target =
            waktuHariIni(
                daftar[0].waktu
            );


        target.setDate(
            target.getDate()+1
        );


        nama =
            daftar[0].nama;

    }


    const selisih =
        target-now;


    const jam =
        Math.floor(
            selisih /
            3600000
        );


    const menit =
        Math.floor(
            (
                selisih %
                3600000
            ) /
            60000
        );


    const detik =
        Math.floor(
            (
                selisih %
                60000
            ) /
            1000
        );


    document.getElementById(
        "countdown"
    ).innerHTML =

        "Menuju " +
        nama +
        " " +

        String(jam)
        .padStart(2,"0") +

        ":" +

        String(menit)
        .padStart(2,"0") +

        ":" +

        String(detik)
        .padStart(2,"0");

}

/* =====================================================
   WAKTU AUDIO
===================================================== */

function getTargetAudioTime(slot){

    /*
       SUBUH
    */

    if(
        slot.id ===
        "audioSubuh"
    ){

        return getWaktuSholat(
            "Subuh"
        );

    }


    /*
       DZUHUR
    */

    if(
        slot.id ===
        "audioDzuhur"
    ){

        return getWaktuSholat(
            "Dzuhur"
        );

    }


    /*
       ASHAR
    */

    if(
        slot.id ===
        "audioAshar"
    ){

        return getWaktuSholat(
            "Ashar"
        );

    }


    /*
       MAGHRIB BIASA

       KAMIS DILARANG BERMAIN
    */

    if(
        slot.id ===
        "audioMaghrib"
    ){

        if(
            new Date().getDay() === 4
        ){

            return null;

        }


        return getWaktuSholat(
            "Maghrib"
        );

    }


    /*
       YASIN

       HANYA KAMIS
       DAN MENGIKUTI MAGHRIB
    */

    if(
        slot.id ===
        "audioYasin"
    ){

        if(
            new Date().getDay() !== 4
        ){

            return null;

        }


        return getWaktuSholat(
            "Maghrib"
        );

    }


    /*
       ISYA
    */

    if(
        slot.id ===
        "audioIsya"
    ){

        return getWaktuSholat(
            "Isya"
        );

    }


    /*
       JUMATAN
    */

    if(
        slot.id ===
        "audioJumatan"
    ){

        if(
            new Date().getDay() !== 5
        ){

            return null;

        }


        return "11:35";

    }


    /*
       AZAN
    */

    if(
        slot.tipe ===
        "azan"
    ){

        return getWaktuSholat(
            slot.target
        );

    }


    /*
       MANUAL
    */

    if(
        slot.tipe ===
        "manual"
    ){

        return (
            audioSettings[
                slot.id
            ]?.time || null
        );

    }


    return null;

}

            }
            else if(
                slot.id ===
                "audioYasin"
            ){

                waktuText =
                    "⏰ Kamis saat Maghrib";

            }
            else if(
                slot.id ===
                "audioJumatan"
            ){

                waktuText =
                    "⏰ Jumat 11:35";

            }
            else{

                waktuText =
                    "⏰ Belum ada waktu";

            }


            div.innerHTML = `

<strong>
${slot.nama}
</strong>

<div class="autoTime">
${waktuText}
</div>

<div class="info">
${getInfoSlot(slot)}
</div>

<input
    type="file"
    id="file_${slot.id}"
    accept="audio/*"
>

${
slot.tipe === "manual"

?

`
<br>
<input
    type="time"
    id="time_${slot.id}"
    step="1"
    value="${data.time || ""}"
>
`

:

""
}

<br>

<button
    onclick="hapusAudio('${slot.id}')"
>
Hapus Audio
</button>

<div
    class="status"
    id="status_${slot.id}"
>
${
data.fileName
?
"File: " + data.fileName
:
"Belum ada file"
}
</div>

`;


            container.appendChild(
                div
            );


            const fileInput =
                document.getElementById(
                    "file_" +
                    slot.id
                );


            fileInput.addEventListener(
                "change",
                async function(){

                    const file =
                        this.files[0];


                    if(!file)
                        return;


                    try{

                        await saveAudio(
                            slot.id,
                            file.name,
                            file
                        );


                        if(
                            !audioSettings[
                                slot.id
                            ]
                        ){

                            audioSettings[
                                slot.id
                            ] = {};

                        }


                        audioSettings[
                            slot.id
                        ].fileName =
                            file.name;


                        localStorage.setItem(
                            "audioSettings",
                            JSON.stringify(
                                audioSettings
                            )
                        );


                        document.getElementById(
                            "status_" +
                            slot.id
                        ).innerText =
                            "File: " +
                            file.name;

                    }
                    catch(e){

                        console.error(e);

                        alert(
                            "Gagal menyimpan audio."
                        );

                    }

                }
            );


            if(
                slot.tipe ===
                "manual"
            ){

                const timeInput =
                    document.getElementById(
                        "time_" +
                        slot.id
                    );


                timeInput.addEventListener(
                    "change",
                    function(){

                        if(
                            !audioSettings[
                                slot.id
                            ]
                        ){

                            audioSettings[
                                slot.id
                            ] = {};

                        }


                        audioSettings[
                            slot.id
                        ].time =
                            this.value;


                        localStorage.setItem(
                            "audioSettings",
                            JSON.stringify(
                                audioSettings
                            )
                        );

                    }
                );

            }

        }
    );

}



/* =====================================================
   HAPUS AUDIO
===================================================== */

async function hapusAudio(id){

    try{

        await deleteAudio(id);

    }
    catch(e){

        console.log(e);

    }


    delete audioSettings[id];


    localStorage.setItem(
        "audioSettings",
        JSON.stringify(
            audioSettings
        )
    );


    buatPanelAudio();

}



/* =====================================================
   PUTAR AUDIO
===================================================== */

async function playAudio(slot){

    if(!audioUnlocked)
        return;


    /*
       Jangan menumpuk audio.
    */

    if(
        activeAudio &&
        !activeAudio.ended
    ){

        return;

    }


    let data;


    try{

        data =
            await getAudio(
                slot.id
            );

    }
    catch(e){

        console.log(e);

        return;

    }


    if(
        !data ||
        !data.file
    ){

        console.log(
            "Belum ada audio:",
            slot.nama
        );

        return;

    }


    const url =
        URL.createObjectURL(
            data.file
        );


    const audio =
        new Audio(url);


    audio.volume =
        Number(
            localStorage.getItem(
                "volume"
            ) || 1
        );


    activeAudio =
        audio;


    activeAudioName =
        slot.nama;


    document.getElementById(
        "nowPlaying"
    ).innerText =
        "▶ " +
        slot.nama;


    audio.onended =
    function(){

        URL.revokeObjectURL(
            url
        );


        activeAudio =
            null;


        activeAudioName =
            "";


        document.getElementById(
            "nowPlaying"
        ).innerText =
            "Tidak ada audio berjalan";

    };


    audio.onerror =
    function(){

        URL.revokeObjectURL(
            url
        );


        activeAudio =
            null;


        activeAudioName =
            "";


        document.getElementById(
            "nowPlaying"
        ).innerText =
            "Tidak ada audio berjalan";

    };


    try{

        await audio.play();

    }
    catch(e){

        console.log(
            "Audio gagal dimainkan:",
            e
        );


        activeAudio =
            null;

    }

}



/* =====================================================
   SCHEDULER
===================================================== */

async function cekAudioOtomatis(){

    if(!audioUnlocked)
        return;


    const now =
        new Date();


    const tanggal =
        now.getFullYear() +
        "-" +
        String(
            now.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            now.getDate()
        ).padStart(2,"0");


    for(
        const slot of AUDIO_SLOTS
    ){

        const waktu =
            getTargetAudioTime(
                slot
            );


        if(!waktu)
            continue;


        const p =
            waktu
            .split(":")
            .map(Number);


        const key =
            tanggal +
            "_" +
            slot.id;


        if(
            playedToday[key]
        ){

            continue;

        }


        /*
           Deteksi 0-2 detik.
        */

        if(

            now.getHours() === p[0] &&

            now.getMinutes() === p[1] &&

            now.getSeconds() <= 2

        ){

            /*
               Tandai lebih dahulu supaya
               tidak dimainkan berkali-kali.
            */

            playedToday[key] =
                true;


            await playAudio(
                slot
            );

        }

    }

}



/* =====================================================
   VOLUME
===================================================== */

const volume =
    document.getElementById(
        "volume"
    );


function updateVolume(){

    const value =
        Number(
            localStorage.getItem(
                "volume"
            ) || 1
        );


    volume.value =
        value;


    document.getElementById(
        "volText"
    ).innerText =
        Math.round(
            value * 100
        ) + "%";

}


volume.oninput =
function(){

    const value =
        Number(
            this.value
        );


    localStorage.setItem(
        "volume",
        value
    );


    if(
        gainNode
    ){

        gainNode.gain.value =
            value;

    }


    /*
       Kalau audio sedang berjalan,
       ubah volume juga.
    */

    if(
        activeAudio
    ){

        activeAudio.volume =
            value;

    }


    document.getElementById(
        "volText"
    ).innerText =
        Math.round(
            value * 100
        ) + "%";

};



/* =====================================================
   CEK HARI BARU
===================================================== */

function cekHariBaru(){

    const hari =
        new Date()
        .toDateString();


    if(
        hari !==
        tanggalTerakhir
    ){

        playedToday = {};


        ambilJadwalSholat();


        updateTanggal();


        buatPanelAudio();

    }

}



/* =====================================================
   SETTING BUTTON
===================================================== */

document.getElementById(
    "settingBtn"
).onclick =
function(){

    const panel =
        document.getElementById(
            "audioPanel"
        );


    if(
        panel.style.display ===
        "none" ||
        panel.style.display === ""
    ){

        panel.style.display =
            "block";

    }
    else{

        panel.style.display =
            "none";

    }

};



/* =====================================================
   START
===================================================== */

async function startSystem(){

    updateJam();

    updateTanggal();

    getPasaranJawa();

    ambilJadwalSholat();

    updateCountdown();

    updateVolume();


    try{

        await openDatabase();

        buatPanelAudio();

    }
    catch(e){

        console.error(
            "IndexedDB error:",
            e
        );

    }


    setInterval(
        updateJam,
        1000
    );


    setInterval(
        updateTanggal,
        60000
    );


    setInterval(
        getPasaranJawa,
        60000
    );


    setInterval(
        updateCountdown,
        1000
    );


    setInterval(
        tampilkanJadwal,
        1000
    );


    setInterval(
        cekHariBaru,
        1000
    );


    setInterval(
        cekAudioOtomatis,
        1000
    );

}


window.onload =
    startSystem;


</script>
